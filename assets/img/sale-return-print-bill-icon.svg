<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" aria-hidden="true">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8EAF6"/>
      <stop offset="100%" style="stop-color:#C5CAE9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Document -->
  <g filter="url(#soft)">
    <rect x="32" y="16" width="62" height="82" rx="8" fill="url(#docGrad)" stroke="#9FA8DA" stroke-width="1.5"/>
    <line x1="44" y1="36" x2="82" y2="36" stroke="#7986CB" stroke-width="2" stroke-linecap="round"/>
    <line x1="44" y1="48" x2="76" y2="48" stroke="#9FA8DA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="44" y1="58" x2="80" y2="58" stroke="#9FA8DA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="44" y1="68" x2="72" y2="68" stroke="#9FA8DA" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Dollar circle -->
  <circle cx="84" cy="42" r="22" fill="#F59E0B"/>
  <circle cx="84" cy="42" r="22" fill="none" stroke="#D97706" stroke-width="1" opacity="0.35"/>
  <text x="84" y="51" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" font-family="system-ui,Segoe UI,Arial,sans-serif">$</text>
  <!-- Check circle -->
  <circle cx="88" cy="88" r="20" fill="#22C55E"/>
  <circle cx="88" cy="88" r="20" fill="none" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <path d="M80 88 L86 96 L98 80" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
