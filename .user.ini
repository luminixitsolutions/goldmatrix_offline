; GoldMatrix — cPanel MultiPHP INI (main.goldmatrixsoft.com / ea-php83)
; Apply via: cPanel → MultiPHP INI Editor → Editor Mode → paste & Save

; --- Errors (production) ---
display_errors = Off
error_log = "error_log"
log_errors = On

; --- Time & input (heavy voucher pages: sale-invoice, product-opening) ---
max_execution_time = 300
max_input_time = 120
max_input_vars = 5000

; --- Memory & uploads ---
memory_limit = 1024M
post_max_size = 128M
upload_max_filesize = 100M

; --- Session ---
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php83"

; --- Response compression (smaller HTML/JS) ---
zlib.output_compression = On
zlib.output_compression_level = 6

; --- OPcache (fast page load — compiled PHP stays in memory) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; --- Realpath cache (fewer disk lookups) ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600
